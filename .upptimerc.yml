# Blinker — Status Page (Upptime)
# https://upptime.js.org/docs/configuration

owner: fabioferrero90
repo: blinker-status

sites:
  - name: Blinker App (sito)
    url: https://blinker-app.com
    icon: https://blinker-app.com/favicon.ico

  - name: Blinker Landing (get)
    url: https://get.blinker-app.com
    icon: https://get.blinker-app.com/favicon.ico

  - name: Blinker Network
    url: https://network.blinker-app.com
    icon: https://network.blinker-app.com/favicon.ico

  - name: Blinker Merch
    url: https://merch.blinker-app.com
    icon: https://merch.blinker-app.com/favicon.ico

  - name: Autenticazione
    # Slug esplicito = quello che Upptime avrebbe generato dal vecchio nome
    # "Supabase Auth API", per non perdere la storia/i grafici già raccolti.
    slug: supabase-auth-api
    icon: https://raw.githubusercontent.com/fabioferrero90/blinker-status/main/assets/logo.png
    url: https://jentlukmtglyfghtozvs.supabase.co/auth/v1/health
    # L'endpoint richiede l'header apikey del gateway Supabase. Questa e'
    # la chiave "publishable"/anon: per progetto, pensata per essere
    # pubblica (e' quella usata lato client app), non un segreto.
    headers:
      - "apikey: sb_publishable_AvEiIGFjLphSe3XqOvCEBA_ayz2M4y7"
    expectedStatusCodes:
      - 200

  - name: Stato generale
    # Slug esplicito = quello generato dal vecchio nome "Blinker Health Check".
    slug: blinker-health-check
    icon: https://raw.githubusercontent.com/fabioferrero90/blinker-status/main/assets/logo.png
    url: https://jentlukmtglyfghtozvs.supabase.co/functions/v1/health-check
    expectedStatusCodes:
      - 200

  - name: Invio notifiche email
    # Slug esplicito = quello generato dal vecchio nome "Invio Email (Resend)".
    slug: invio-email-resend
    icon: https://raw.githubusercontent.com/fabioferrero90/blinker-status/main/assets/logo.png
    url: https://jentlukmtglyfghtozvs.supabase.co/functions/v1/health-check?check=email
    expectedStatusCodes:
      - 200

  - name: Certificato SSL blinker-app.com
    # Il check ssl apre una connessione TLS diretta: vuole solo l'hostname,
    # NON uno schema https:// (altrimenti e' un errore DNS, non un vero down).
    url: blinker-app.com
    check: ssl

status-website:
  cname: status.blinker-app.com
  logoUrl: https://raw.githubusercontent.com/fabioferrero90/blinker-status/main/assets/logo.png
  name: Blinker Status
  introTitle: "**Stato dei servizi Blinker**"
  introMessage: Monitoraggio in tempo reale di app, siti e servizi dell'ecosistema Blinker. Controlli automatici ogni 5 minuti.
  navbar:
    - title: Download app
      href: https://get.blinker-app.com

# Footer di default di Upptime linka al repo GitHub ("This page is open
# source..."): lo sovrascriviamo per non esporre il link GitHub in pagina.
i18n:
  footer: ""

# Secret allowlist: niente oltre ai secret di notifica Telegram, già gestiti
# automaticamente da Upptime (NOTIFICATION_TELEGRAM*). Nessun secret custom
# qui: i token Supabase/Resend restano SOLO lato Edge Function, mai esposti
# in questo repo pubblico.
