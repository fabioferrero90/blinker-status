# Blinker — Status Page (Upptime)
# https://upptime.js.org/docs/configuration

owner: fabioferrero90
repo: blinker-status

sites:
  # Nomi pensati per chi usa Blinker. Lo `slug` resta quello di prima, così la storia e i grafici non si perdono.

  - name: App Blinker (dati e servizi)
    slug: blinker-health-check
    icon: https://raw.githubusercontent.com/fabioferrero90/blinker-status/main/assets/logo.png
    # Funzione health-check: database, configurazione dell'invio email di accesso, chiave Resend.
    url: https://jentlukmtglyfghtozvs.supabase.co/functions/v1/health-check
    expectedStatusCodes:
      - 200

  - name: Accesso e registrazione
    slug: supabase-auth-api
    icon: https://raw.githubusercontent.com/fabioferrero90/blinker-status/main/assets/logo.png
    url: https://jentlukmtglyfghtozvs.supabase.co/auth/v1/health
    # L'endpoint richiede l'header apikey del gateway Supabase. Questa e' la chiave "publishable": per progetto,
    # pensata per essere pubblica (e' quella dentro l'app), non un segreto.
    headers:
      - "apikey: sb_publishable_AvEiIGFjLphSe3XqOvCEBA_ayz2M4y7"
    expectedStatusCodes:
      - 200

  - name: Email (conferme, password e notifiche)
    slug: invio-email-resend
    icon: https://raw.githubusercontent.com/fabioferrero90/blinker-status/main/assets/logo.png
    url: https://jentlukmtglyfghtozvs.supabase.co/functions/v1/health-check?check=email
    expectedStatusCodes:
      - 200

  - name: Sito blinker-app.com
    slug: blinker-app-sito
    url: https://blinker-app.com
    icon: https://blinker-app.com/favicon.ico

  - name: Pagina per scaricare l'app
    slug: blinker-landing-get
    url: https://get.blinker-app.com
    icon: https://get.blinker-app.com/favicon.ico

  - name: Blinker Business
    slug: blinker-business
    url: https://business.blinker-app.com
    icon: https://business.blinker-app.com/square.png

  - name: Blinker Network
    slug: blinker-network
    url: https://network.blinker-app.com
    icon: https://network.blinker-app.com/favicon.ico

  - name: Negozio Blinker Merch
    slug: blinker-merch
    url: https://merch.blinker-app.com
    icon: https://merch.blinker-app.com/favicon.ico

  - name: Connessione sicura del sito (certificato)
    slug: certificato-ssl-blinker-app-com
    # Il check ssl apre una connessione TLS diretta: vuole solo l'hostname, NON uno schema https://.
    url: blinker-app.com
    check: ssl

status-website:
  cname: status.blinker-app.com
  logoUrl: https://raw.githubusercontent.com/fabioferrero90/blinker-status/main/assets/logo.png
  favicon: https://raw.githubusercontent.com/fabioferrero90/blinker-status/main/assets/logo.png
  name: Stato dei servizi Blinker
  introTitle: "**Blinker funziona?**"
  introMessage: >-
    Qui vedi se l'app e i siti Blinker funzionano. **Verde**: tutto regolare. **Giallo**: il servizio risponde ma è
    lento. **Rosso**: il servizio non risponde e ce ne stiamo occupando. I controlli sono automatici e avvengono più
    volte al giorno: se c'è un problema lo trovi qui sotto, in «Problemi in corso», con gli aggiornamenti. Se qualcosa
    non funziona ma qui è tutto verde, scrivici a [support@blinker-app.com](mailto:support@blinker-app.com).
  navbar:
    - title: Scarica l'app
      href: https://get.blinker-app.com
    - title: Assistenza
      href: mailto:support@blinker-app.com

